name: Flutter CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies (dart_sdk)
        run: flutter pub get
        working-directory: packages/dart_sdk

      - name: Install dependencies (flutter_sdk)
        run: flutter pub get
        working-directory: packages/flutter_sdk

      - name: Generate mocks (dart_sdk)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/dart_sdk

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed packages/dart_sdk/lib packages/dart_sdk/test packages/flutter_sdk/lib packages/flutter_sdk/test

      - name: Analyze dart_sdk
        run: dart analyze --no-fatal-warnings
        working-directory: packages/dart_sdk

      - name: Analyze flutter_sdk
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
        working-directory: packages/flutter_sdk

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies (dart_sdk)
        run: flutter pub get
        working-directory: packages/dart_sdk

      - name: Generate mocks (dart_sdk)
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/dart_sdk

      - name: Test dart_sdk
        run: dart test
        working-directory: packages/dart_sdk

      - name: Install dependencies (flutter_sdk)
        run: flutter pub get
        working-directory: packages/flutter_sdk

      - name: Test flutter_sdk
        run: flutter test --coverage
        working-directory: packages/flutter_sdk

  build_example:
    name: Build Example App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies for example
        run: flutter pub get
        working-directory: packages/flutter_sdk/example

      - name: Build example app
        run: flutter build web --release
        working-directory: packages/flutter_sdk/example
