name: absmartly_dart
description: ABsmartly A/B Testing SDK for Dart - Pure Dart implementation with no Flutter dependencies
version: 2.1.2
homepage: https://github.com/absmartly/flutter-sdk
repository: https://github.com/absmartly/flutter-sdk/tree/main/packages/dart_sdk

environment:
  sdk: '>=2.18.6 <4.0.0'

dependencies:
  http_parser: '^4.0.2'
  async: '^2.9.0'
  crypto: '^3.0.6'
  http: '>=0.13.0 <2.0.0'
  intl: '>=0.19.0'
  collection: '^1.16.0'

dev_dependencies:
  test: '^1.24.0'
  mockito: '^5.4.2'
  build_runner: '^2.4.5'
  lints: '^3.0.0'
